<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive 3D hover cards built with pure HTML and CSS.">
  <title>3D Hover Cards</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header class="page-header">
    <h1>3D Hover Cards</h1>
    <p>Hover, tap or tab to a card to bring its character to life.</p>
  </header>

  <main class="cards">
    <div class="card" tabindex="0" role="group" aria-label="Dark Rider">
      <div class="wrapper">
        <img src="./Images/dark_rider-cover.jpg" class="cover-image" alt="" width="600" height="900" decoding="async" />
      </div>
      <img src="./Images/dark_rider-title.png" class="title" alt="Dark Rider" decoding="async" />
      <img src="./Images/dark_rider-character.webp" class="character" alt="The Dark Rider character" decoding="async" />
    </div>

    <div class="card" tabindex="0" role="group" aria-label="Force Mage">
      <div class="wrapper">
        <img src="./Images/force_mage-cover.jpg" class="cover-image" alt="" width="600" height="900" decoding="async" />
      </div>
      <img src="./Images/force_mage-title.png" class="title" alt="Force Mage" decoding="async" />
      <img src="./Images/force_mage-character.webp" class="character" alt="The Force Mage character" decoding="async" />
    </div>
  </main>

  <footer class="page-footer">
    Effect inspired by <a href="https://www.instagram.com/coding.stella/" target="_blank" rel="noopener noreferrer">@coding.stella</a>
  </footer>

</body>
</html>
